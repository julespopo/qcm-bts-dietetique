<section id="localLoader" class="card" style="padding:18px;margin-top:16px">
  <h2>Charger les banques</h2>
  <p class="muted">Sélectionne le dossier <strong>banques</strong>. Tous ses sous-dossiers seront lus automatiquement.</p>
  <label>
    <span style="display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer">Choisir le dossier banques</span>
    <input id="folderInput" type="file" accept=".json,application/json" multiple webkitdirectory style="display:block;margin-top:12px">
  </label>
  <p id="loadStatus" class="muted" style="margin:12px 0 0">Aucune banque chargée.</p>
</section>
